aws:
  bedrock_runtime_endpoint: null
  region: us-east-1
database:
  chunk_overlap: 200
  chunk_size: 1000
  collection_name: property_documents
  vector_store_type: faiss
logging:
  file: null
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  level: INFO
model:
  max_tokens: 4096
  temperature: 0.1
  text_embedding: amazon.titan-embed-text-v1
  text_generation: anthropic.claude-3-5-sonnet-20240620-v1:0
processing:
  batch_size: 10
  extract_images: true
  max_workers: 4
  supported_extensions:
  - .pdf
  - .txt
  - .md
  - .docx
  - .doc
retrieval:
  k: 10
  score_threshold: 0.7
ui:
  port: 7860
  share: false
  theme: soft
